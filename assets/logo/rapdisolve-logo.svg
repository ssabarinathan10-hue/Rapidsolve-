<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="logo-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    
    <linearGradient id="logo-grad-accent" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(10, 10)">
    <!-- Outer Hex/Diamond Structure with Dissolve Nodes -->
    <path d="M 50 5 L 85 25 L 85 75 L 50 95 L 15 75 L 15 25 Z" 
          fill="none" 
          stroke="url(#logo-grad-primary)" 
          stroke-width="3.5" 
          stroke-dasharray="60 10 30 10" 
          filter="url(#glow)"/>
    
    <!-- Inner Dynamic R Symbol with Rapid Slash -->
    <path d="M 35 30 L 55 30 C 65 30 70 36 70 43 C 70 50 64 55 54 55 L 35 55 Z" 
          fill="none" 
          stroke="url(#logo-grad-accent)" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <path d="M 35 30 L 35 70 M 52 55 L 68 70" 
          stroke="url(#logo-grad-primary)" 
          stroke-width="4.5" 
          stroke-linecap="round"/>
    
    <!-- Dissolving Particles / Dots -->
    <circle cx="85" cy="25" r="3" fill="#06B6D4" filter="url(#glow)"/>
    <circle cx="92" cy="18" r="2" fill="#8B5CF6" opacity="0.8"/>
    <circle cx="97" cy="12" r="1.5" fill="#EC4899" opacity="0.6"/>
    <circle cx="15" cy="75" r="2.5" fill="#3B82F6" filter="url(#glow)"/>
    <circle cx="8" cy="82" r="1.5" fill="#06B6D4" opacity="0.7"/>
  </g>

  <!-- Typography -->
  <g transform="translate(115, 68)">
    <!-- Text RAPIDSOLVE -->
    <text font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" 
          font-weight="800" 
          font-size="34" 
          letter-spacing="2.5" 
          fill="url(#text-grad)">RAPIDSOLVE</text>
    
    <!-- Subtitle / Tagline -->
    <text x="3" y="22" 
          font-family="'Outfit', 'Inter', sans-serif" 
          font-weight="500" 
          font-size="11" 
          letter-spacing="5" 
          fill="#06B6D4" 
          opacity="0.9">DIGITAL INNOVATION STUDIO</text>
  </g>
</svg>
